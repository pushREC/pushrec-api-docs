-left'],div[class^='Header-left'] {\n    padding-left: 16px;\n}\n\n/* Search bar header */\ndiv[class*=' Header-search'],div[class^='Header-search'] {\n    padding-right: 4px;\n}\n\n/* Search bar */\n.rm-SearchToggle {\n    background: #ECF1F9 0% 0% no-repeat padding-box !important;\n    border: 1px solid #FFFFFF !important;\n    border-radius: 20px !important;\n    box-shadow: none !important;\n    text-transform: uppercase;\n    padding: 9px 18px !important;\n}\n\n@media only screen and (min-width: 770px) {\n    .rm-SearchToggle {\n        width: 249px !important;\n    }\n}\n\n/* Search bar icon */\n.rm-SearchToggle-icon {\n    color: #232A55 !important;\n}\n\n/* Search bar text */\n.rm-SearchToggle-placeholder {\n    font: normal normal normal 10px/12px Inter !important;\n    color: #232A55 !important;\n}\n\n/* Search bar shortcut text */\n.rm-SearchToggle-shortcut {\n    font: normal normal normal 10px/12px Inter !important;\n    color: #232A55 !important;\n}\n\n/*\n** SIDEBAR\n*/\n\n.hub-sidebar {\n    flex: 0 0 264px !important;\n}\n\n/* Sidebar main section */\ndiv[class*=' Main-QuickNav'],div[class^='Main-QuickNav'] {\n    padding-left: 6px;\n}\n\n/* `Jump To` search */\nbutton[class*=' QuickNav'],button[class^='QuickNav'] {\n    border: 1px solid white;\n    background: #ECF1F9 0% 0% no-repeat padding-box;\n    border-radius: 20px;\n    opacity: 1;\n    color: #232A55;\n    text-align: left;\n    font: normal normal normal 10px/12px Inter;\n    letter-spacing: 0px;\n    height: 30px;\n    width: 249px;\n    padding-left: 16px;\n    padding-right: 18px;\n}\n\n/* `Jump To` search shortcut icon */\nspan[class*=' QuickNav-key'],span[class^='QuickNav-key'] {\n    border: none;\n    background: none;\n    font: normal normal normal 10px/12px Inter;\n}\n\n/* Remove top header from sidebar */\nh3[class*=' Sidebar-heading'] {\n  display: none; \n}\n\nh2[class^='Sidebar-heading'] {\n  text-transform: none !important;\n  color: #000 !important;\n  font-weight: 600 !important;\n  font-size: 15px !important;\n  margin-bottom: 5px;\n}\n\n/* Sidebar section header styling  */\na[class*=' Sidebar-link_parent'],a[class^='Sidebar-link_parent'] {\n    color: #181B38 !important;\n    font: normal normal 400 14px/16px Inter !important;\n    opacity: 1;\n    margin-bottom: 3px;\n}\n\n/* Sidebar body */\n.rm-Sidebar {\n    padding-left: 12px;\n}\n\n/* Sublists below sections */\n.subpages {\n    margin-bottom: 29px !important;\n}\n\n/* Add arrows to the right of sidebar headers */\na[class*=' Sidebar-link_parent']::after,a[class^='Sidebar-link_parent']::after {\n    content: url(data:image/svg+xml;base64,);\n    margin-right: 16px;\n}\n\n/* Remove arrows on the left of sidebar headers */\ni[class*=' Sidebar-link-expandIcon'],i[class^='Sidebar-link-expandIcon'] {\n    display: none !important;\n}\n\n/* Endpoint list items in sidebar */\n.rm-Sidebar-link.childless {\n    font: normal normal normal 14px/19px Inter !important;\n    letter-spacing: 0px;\n    color: #232A55;\n    margin-left: 0px !important;\n    margin-bottom:6px;\n}\n\n.rm-Sidebar-section {\n  margin-top: 0px !important;\n}\n\n\n.rm-Sidebar-list {\n  margin-bottom: 15px !important;\n}\n\n\n/*\n** BODY\n*/\n\n/* Headline container */\nheader[class*= ' headline-container'],header[class^='headline-container'] {\n    padding-bottom: 32px;\n}\n\n/* Title */\ndiv[class*=' headline-container-grid-item'] h1,div[class^='headline-container-grid-item'] h1 {\n    font: normal normal bold 30px/40px Inter !important;\n    color: #181B38 !important;\n    margin-bottom: 8px;\n}\n\n/* API Method in headline */\nspan[class*=' headline-container-api-method'],span[class^='headline-container-api-method'] {\n    margin-right: 12px;\n}\n\n/* Endpoint URL */\nspan[class*=' headline-container-article-info-url'],span[class^='headline-container-article-info-url'] {\n    font: normal normal normal 14px/17px Inter;\n    color: #232A55;\n    margin-top: 2px;\n}\n\n/* Doc Subtitle */\ndiv[role=\&quot;doc-sub